<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascend Markets</title>
<meta name="description" content="Ascend Markets: weekly market notes by Christian Walton, Mathematics with Data Science student at LSE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#152033; --muted:#5E6B7E;
  --rule:#DCE1E8; --accent:#0B7A5E; --accent-soft:#DDF1EA;
  --font:'Google Sans','Product Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1621; --surface:#161F2C; --ink:#E7ECF3; --muted:#9AA6B6;
    --rule:#273244; --accent:#3CC79C; --accent-soft:#16352D;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1621; --surface:#161F2C; --ink:#E7ECF3; --muted:#9AA6B6;
  --rule:#273244; --accent:#3CC79C; --accent-soft:#16352D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
img{max-width:100%}
.wrap{max-width:1040px;margin:0 auto;padding:0 1.5rem}

/* Header */
.site{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 0}
.mark{font-weight:700;font-size:1.05rem;text-decoration:none;letter-spacing:-0.01em}
.site nav{display:flex;gap:1.5rem}
.site nav a{text-decoration:none;color:var(--muted);font-weight:500}
.site nav a[aria-current="page"],.site nav a:hover{color:var(--ink)}

/* Intro */
.intro{padding:3.5rem 0 2.5rem;max-width:760px}
.intro h1{font-size:clamp(2.5rem,7vw,4.5rem);line-height:1.02;letter-spacing:-0.035em;
  font-weight:700;margin:0 0 1.5rem}
.intro p{font-size:1.2rem;color:var(--muted);margin:0;max-width:60ch}

/* Cadence strip: the signature element */
.cadence{padding:2rem 0 3rem;border-bottom:1px solid var(--rule)}
.cells{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.9rem}
.cell{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--rule);background:transparent;display:block}
a.cell{background:var(--accent);border-color:var(--accent);transition:transform .15s}
a.cell:hover{transform:scale(1.18)}
.cadence p{margin:0;color:var(--muted);font-size:.95rem}
.cadence strong{color:var(--ink);font-weight:500}

/* Article list */
.list{padding:3rem 0 4rem}
.list-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:1.5rem}
.list-head h2{margin:0;font-size:1.5rem;letter-spacing:-0.02em}
.filters{display:flex;flex-wrap:wrap;gap:.5rem}
.filters button{font:inherit;font-size:.9rem;border:1px solid var(--rule);background:var(--surface);
  color:var(--muted);padding:.3rem .85rem;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.posts{list-style:none;margin:0;padding:0}
.posts li{border-top:1px solid var(--rule)}
.posts li:last-child{border-bottom:1px solid var(--rule)}
.posts a{display:grid;grid-template-columns:9rem 1fr;gap:1.5rem;padding:1.6rem 0;text-decoration:none}
.posts time{color:var(--muted);font-size:.95rem;padding-top:.2rem}
.posts h3{margin:0 0 .35rem;font-size:1.3rem;line-height:1.3;letter-spacing:-0.015em}
.posts a:hover h3{color:var(--accent)}
.posts p{margin:0 0 .6rem;color:var(--muted);max-width:65ch}
.meta{display:flex;flex-wrap:wrap;gap:.5rem 1rem;font-size:.88rem;color:var(--muted)}
.tag{color:var(--accent);font-weight:500}
.empty{color:var(--muted);padding:2rem 0}

/* Article page */
.article{max-width:700px;padding:2.5rem 0 4rem}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:.95rem;margin-bottom:2rem}
.back:hover{color:var(--ink)}
.article h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;letter-spacing:-0.03em;margin:0 0 1rem}
.article .meta{margin-bottom:2.5rem;font-size:.95rem}
.prose{font-size:1.125rem;line-height:1.72}
.prose h2{font-size:1.45rem;letter-spacing:-0.02em;margin:2.5rem 0 .75rem;line-height:1.25}
.prose h3{font-size:1.15rem;margin:2rem 0 .5rem}
.prose p,.prose ul,.prose ol{margin:0 0 1.25rem}
.prose li{margin-bottom:.4rem}
.prose blockquote{margin:2rem 0;padding:.25rem 0 .25rem 1.25rem;border-left:3px solid var(--accent);
  font-size:1.25rem;line-height:1.5;color:var(--ink)}
.prose a{color:var(--accent)}
.prose .table-scroll{overflow-x:auto;margin:1.5rem 0}
.prose table{border-collapse:collapse;width:100%;font-size:.98rem;font-variant-numeric:tabular-nums}
.prose th,.prose td{text-align:left;padding:.55rem .75rem;border-bottom:1px solid var(--rule)}
.prose th{font-weight:500;color:var(--muted)}
.prose code{font-size:.92em;background:var(--accent-soft);padding:.1em .35em;border-radius:4px}
.prose hr{border:0;border-top:1px solid var(--rule);margin:2.5rem 0}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:1rem;border-top:1px solid var(--rule);margin-top:3rem;padding-top:1.5rem}
.pager a{text-decoration:none;display:block}
.pager span{display:block;font-size:.85rem;color:var(--muted)}
.pager strong{font-weight:500}
.pager a:hover strong{color:var(--accent)}
.pager .next{text-align:right;grid-column:2}

/* About */
.about{max-width:680px;padding:2.5rem 0 4rem}
.about h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-0.03em;margin:0 0 1.5rem;line-height:1.1}
.about h2{font-size:1.2rem;margin:2.25rem 0 .5rem}
.about p{margin:0 0 1.1rem}
.contact a{color:var(--accent);font-weight:500}

footer{border-top:1px solid var(--rule);padding:2rem 0 3rem;color:var(--muted);font-size:.9rem}
footer p{margin:0}

@media (max-width:640px){
  .posts a{grid-template-columns:1fr;gap:.25rem}
  .intro{padding-top:2rem}
  .cell{width:18px;height:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="mark" href="#/">Ascend Markets</a>
    <nav aria-label="Main">
      <a href="#/" data-nav="home">Articles</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>
  </header>
  <main id="app"></main>
  <footer>
    <p>© <span id="yr"></span> Ascend Markets by Christian Walton. Views are my own and do not constitute investment advice.</p>
  </footer>
</div>

<script>
/* =========================================================
   ARTICLES
   To add a new article, copy one block below, paste it at
   the TOP of the list, and fill it in. Write the body in
   Markdown (## for headings, - for bullets, > for quotes).
   ========================================================= */
const POSTS = [
  {
    slug: "why-a-weekly-markets-note",
    title: "Why I'm writing a weekly markets note",
    date: "2026-10-12",
    tags: ["About this blog"],
    summary: "What this blog is for, how each article is structured, and what to expect each week.",
    body: `
Markets generate more commentary than anyone can read. Most of it is either too fast to be useful or too long to finish. This blog is my attempt at something in between: one story a week, explained properly, in a few minutes of reading.

Writing regularly also forces discipline. It's easy to have a vague opinion about a market move. It's much harder to write it down, back it with numbers, and come back a week later to see whether it held up.

## How each note is structured

Every article follows the same shape, so it's quick to read and easy to compare week to week:

- **The story.** What happened, in plain terms.
- **The numbers.** The data that matters, and the context that makes it meaningful.
- **Why it matters.** Who is affected, and what the move tells us about the wider market.
- **What I'm watching.** The signals that would confirm or challenge the view.

## What I'll cover

Mostly equities, macro and rates, with the occasional piece on FX or commodities when something significant is happening. Where it helps, I'll lean on my background in mathematics and data science to look at the numbers behind a story rather than just the headline.

> The aim is simple: one clear, well-supported idea every week.

## A note on views

Everything here is my own analysis, written for learning and discussion. None of it is investment advice.
`
  }
];

/* ================= Site logic (no need to edit) ================= */
const app = document.getElementById('app');
document.getElementById('yr').textContent = new Date().getFullYear();
const posts = POSTS.slice().sort((a,b)=> b.date.localeCompare(a.date));
let activeTag = 'All';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const readTime = t => Math.max(1, Math.round(t.trim().split(/\s+/).length/220)) + ' min read';
function md(text){
  if (window.marked) {
    const html = marked.parse(text.trim());
    return html.replace(/<table>/g,'<div class="table-scroll"><table>').replace(/<\/table>/g,'</table></div>');
  }
  return text.trim().split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('');
}
function monday(d){ const x=new Date(d); x.setHours(12,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }

function setNav(which){
  document.querySelectorAll('[data-nav]').forEach(a=>{
    if(a.dataset.nav===which) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
}

function cadence(){
  if(!posts.length) return '';
  const first = monday(posts[posts.length-1].date+'T12:00:00');
  const now = monday(new Date());
  const weeks = [];
  for(let w=new Date(first); w<=now; w.setDate(w.getDate()+7)) weeks.push(new Date(w));
  if(!weeks.length) weeks.push(first);
  const cells = weeks.map(w=>{
    const end = new Date(w); end.setDate(end.getDate()+7);
    const p = posts.find(p=>{ const d=new Date(p.date+'T12:00:00'); return d>=w && d<end; });
    const label = 'Week of ' + w.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return p
      ? `<a class="cell" href="#/post/${p.slug}" title="${esc(label+': '+p.title)}" aria-label="${esc(label+': '+p.title)}"></a>`
      : `<span class="cell" title="${esc(label)}" aria-hidden="true"></span>`;
  }).join('');
  const n = posts.length, wk = weeks.length;
  return `<section class="cadence" aria-label="Publishing record">
    <div class="cells">${cells}</div>
    <p><strong>${n} article${n===1?'':'s'}</strong> across ${wk} week${wk===1?'':'s'}, published every week since ${fmtDate(posts[posts.length-1].date)}.</p>
  </section>`;
}

function renderHome(){
  setNav('home');
  const tags = ['All', ...new Set(posts.flatMap(p=>p.tags))];
  const shown = activeTag==='All' ? posts : posts.filter(p=>p.tags.includes(activeTag));
  app.innerHTML = `
    <section class="intro">
      <h1>Notes on markets, every week.</h1>
      <p>I'm Christian, a Mathematics with Data Science student at LSE. Each week I break down one market story: what happened, why it matters, and what to watch next.</p>
    </section>
    ${cadence()}
    <section class="list" aria-labelledby="articles-h">
      <div class="list-head">
        <h2 id="articles-h">Articles</h2>
        ${tags.length>2 ? `<div class="filters" role="group" aria-label="Filter by topic">${tags.map(t=>`<button type="button" data-tag="${esc(t)}" aria-pressed="${t===activeTag}">${esc(t)}</button>`).join('')}</div>` : ''}
      </div>
      ${shown.length ? `<ol class="posts">${shown.map(p=>`
        <li><a href="#/post/${p.slug}">
          <time datetime="${p.date}">${fmtDate(p.date)}</time>
          <div>
            <h3>${esc(p.title)}</h3>
            <p>${esc(p.summary)}</p>
            <div class="meta">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span>${readTime(p.body)}</span></div>
          </div>
        </a></li>`).join('')}</ol>` : `<p class="empty">No articles on this topic yet. Choose All to see every article.</p>`}
    </section>`;
  app.querySelectorAll('[data-tag]').forEach(b=>b.addEventListener('click',()=>{activeTag=b.dataset.tag;renderHome();}));
}

function renderPost(slug){
  setNav('home');
  const i = posts.findIndex(p=>p.slug===slug);
  if(i<0){ app.innerHTML = `<section class="article"><a class="back" href="#/">All articles</a><h1>Article not found</h1><p>This link doesn't match any article. Go back to the list to find it.</p></section>`; return; }
  const p = posts[i], newer = posts[i-1], older = posts[i+1];
  document.title = p.title + ' | Ascend Markets';
  app.innerHTML = `
    <article class="article">
      <a class="back" href="#/">All articles</a>
      <h1>${esc(p.title)}</h1>
      <div class="meta"><time datetime="${p.date}">${fmtDate(p.date)}</time>${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span>${readTime(p.body)}</span></div>
      <div class="prose">${md(p.body)}</div>
      ${(newer||older) ? `<nav class="pager" aria-label="More articles">
        ${older ? `<a href="#/post/${older.slug}"><span>Previous</span><strong>${esc(older.title)}</strong></a>` : ''}
        ${newer ? `<a class="next" href="#/post/${newer.slug}"><span>Next</span><strong>${esc(newer.title)}</strong></a>` : ''}
      </nav>` : ''}
    </article>`;
}

function renderAbout(){
  setNav('about');
  document.title = 'About | Ascend Markets';
  app.innerHTML = `
    <section class="about">
      <h1>About</h1>
      <p>I'm Christian Walton, a second-year BSc Mathematics with Data Science student at the London School of Economics.</p>
      <h2>Why this blog</h2>
      <p>I started writing a weekly note to sharpen my thinking about markets and to build a public record of it. Each piece takes one story and works through the numbers behind it.</p>
      <h2>Get in touch</h2>
      <p class="contact">Email <a href="mailto:c.walton2@lse.ac.uk">c.walton2@lse.ac.uk</a></p>
      <p class="contact">Phone <a href="tel:+447843160935">+44 7843 160935</a></p>
    </section>`;
}

function route(){
  const h = location.hash.replace(/^#\/?/,'');
  if(h.startsWith('post/')) renderPost(h.slice(5));
  else if(h==='about') renderAbout();
  else { document.title='Ascend Markets'; renderHome(); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
